name: Temporary VPS network diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read SSH banner and HTTPS health status
        run: |
          python3 - <<'PY'
          import json
          import socket
          import urllib.error
          import urllib.request

          try:
              with socket.create_connection(('185.72.146.214', 22), timeout=8) as connection:
                  connection.settimeout(8)
                  print(json.dumps({'check': 'ssh', 'connected': True}), flush=True)
                  try:
                      banner = connection.recv(256)
                      if banner.startswith(b'SSH-'):
                          first_line = banner.splitlines()[0].decode('ascii', errors='replace')
                          safe = ''.join(c if 32 <= ord(c) <= 126 else '?' for c in first_line)
                          print(json.dumps({'check': 'ssh_banner', 'banner': safe}), flush=True)
                      else:
                          print(json.dumps({'check': 'ssh_banner', 'errorType': 'EOFBeforeSSHBanner' if not banner else 'NonSSHData'}), flush=True)
                  except Exception as error:
                      print(json.dumps({'check': 'ssh_banner', 'errorType': type(error).__name__}), flush=True)
          except Exception as error:
              print(json.dumps({'check': 'ssh', 'connected': False, 'errorType': type(error).__name__}), flush=True)

          try:
              request = urllib.request.Request('https://svoi.185-72-146-214.sslip.io/api/health', headers={'User-Agent': 'svoi-network-diagnostic'})
              with urllib.request.urlopen(request, timeout=8) as response:
                  print(json.dumps({'check': 'https_health', 'status': response.status}), flush=True)
          except urllib.error.HTTPError as error:
              print(json.dumps({'check': 'https_health', 'status': error.code}), flush=True)
          except Exception as error:
              print(json.dumps({'check': 'https_health', 'errorType': type(error).__name__}), flush=True)
          PY
